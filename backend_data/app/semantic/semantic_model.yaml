# app/semantic/semantic_model.yaml

tables:
  # --- HECHOS (SALES) ---
  - name: sales
    schema: public
    description: "Tabla principal de hechos que registra cada venta individual."
    columns:
      - name: sale_id
        type: integer
        description: "ID único de la venta."
      - name: sale_timestamp
        type: timestamp
        description: "Marca de tiempo completa de la venta."
      - name: sales_channel
        type: text
        description: "Canal de venta (Online, Tienda física, Distribuidor,etc.)."
      - name: total
        type: numeric
        description: "Monto total de la venta (dinero)."
      - name: quantity
        type: integer
        description: "Cantidad de unidades vendidas."
      - name: payment_method
        type: text
        description: "Método de pago usado (Credit Card, PayPal, Cash, etc.)."
      - name: discount_amount
        type: numeric
        description: "Monto descontado en la venta."

    # Métricas pre-calculadas
    metrics:
      - name: total_sales
        sql: "SUM(total)"
        description: "USAR PARA: 'Ventas totales', 'Ingresos', 'Facturación', 'Dinero generado'. Es la suma monetaria bruta."
      - name: total_quantity
        sql: "SUM(quantity)"
        description: "USAR PARA: 'Unidades vendidas', 'Cantidad de productos', 'Volumen de artículos'. Es el total de unidades (productos) vendidas."
      - name: count_sales
        sql: "COUNT(sale_id)"
        description: "USAR PARA: 'Número de ventas', 'Cantidad de transacciones', 'Frecuencia de compra'. Es el numero total de tickets emitidos. "
      - name: avg_ticket
        sql: "AVG(total)"
        description: "USAR PARA: 'Ticket promedio', 'Valor promedio de transacción'. ATENCIÓN: NO USAR para 'Promedio de ventas por día' (para eso, agrupar total_sales por fecha)."
      - name: unique_customers
        sql: "COUNT(DISTINCT customer_id)"
        description: "USAR PARA: 'Cuántos clientes', 'Clientes únicos'. Cuenta personas distintas, no transacciones."
      - name: unique_employees
        sql: "COUNT(DISTINCT employee_id)"
        description: "USAR PARA: 'Cuántos empleados', 'Empleados únicos'. Cuenta personas distintas, no transacciones."
      - name: total_discounts
        sql: "SUM(discount_amount)"
        description: "Monto total de dinero descontado en las ventas."
      - name: discount_rate
        sql: "SUM(discount_amount) / NULLIF(SUM(total), 0)"
        description: "Porcentaje o tasa de descuento aplicado (Ratio). Resultado en decimal."

  # --- DIMENSIONES ---
  - name: products
    schema: public
    description: "Catálogo de productos."
    columns:
      - name: product_id
        type: integer
      - name: product_name
        type: text
        description: "Nombre comercial del producto. Contiene items específicos como 'Monitor Samsung', 'Zapatillas Nike', 'Laptop Dell', 'Teclado'."
      - name: category
        type: text
        description: "Contiene grupos de alto nivel como (Electrónica, Hogar, etc.)"
      - name: unit_price
        type: numeric
        description: "Precio unitario actual."

  - name: customers
    schema: public
    description: "Información de clientes."
    columns:
      - name: customer_id
        type: integer
      - name: region
        type: text
        description: "Región geográfica o País del cliente."
      - name: email
        type: text
        description: "Correo electrónico del cliente (Dato Sensible)."
      - name: first_name_customer
        type: text
        description: "Nombre del cliente."
      - name: last_name_customer
        type: text
        description: "Apellido del cliente."

  - name: employees
    schema: public
    description: "Información de empleados y vendedores."
    columns:
      - name: employee_id
        type: integer
        description: "ID único del empleado."
      - name: first_name
        type: text
        description: "Nombre del empleado."
      - name: last_name
        type: text
        description: "Apellido del empleado."
      - name: email
        type: text
        description: "Correo electrónico del empleado (Dato Sensible)."
      - name: department
        type: text
        description: "Departamento (Ventas, IT, etc.)."
      - name: position
        type: text
        description: "Cargo del empleado."
      - name: salary
        type: numeric
        description: "Salario mensual (CONFIDENCIAL: Solo Admin)."

# --- RELACIONES (JOINS) ---
# Para que la IA pueda entender cómo unir las tablas sin equivocarse.
relationships:
  - from_table: sales
    from_column: product_id
    to_table: products
    to_column: product_id
    type: many_to_one

  - from_table: sales
    from_column: customer_id
    to_table: customers
    to_column: customer_id
    type: many_to_one

  - from_table: sales
    from_column: employee_id
    to_table: employees
    to_column: employee_id
    type: many_to_one
