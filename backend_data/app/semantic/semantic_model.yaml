# app/semantic/semantic_model.yaml

tables:
  # --- HECHOS (FACTS) ---
  - name: fact_sales
    schema: curated
    description: "Tabla principal de hechos que registra cada venta individual."
    columns:
      - name: sale_id
        type: integer
        description: "ID único de la venta."
      - name: sale_date
        type: date
        description: "Fecha exacta de la venta (YYYY-MM-DD)."
      - name: sale_ts
        type: timestamp
        description: "Marca de tiempo completa de la venta."
      - name: total
        type: numeric
        description: "Monto total de la venta (dinero)."
      - name: quantity
        type: integer
        description: "Cantidad de unidades vendidas."
      - name: sales_channel
        type: text
        description: "Canal de venta (Online, Tienda, etc.)."
      - name: year
        type: integer
        description: "El AÑO de la venta (ej: 2023). Es un NÚMERO. Usa comparadores matemáticos (=, >, <). ESTÁ TOTALMENTE PROHIBIDO usar funciones de texto como 'unaccent', 'lower' o 'ILIKE' sobre esta columna."
      - name: month
        type: integer
        description: "El número de mes (1-12). Es un NÚMERO. Úsalo para ordenar cronológicamente. Usar solo operadores matemáticos (=). ESTÁ TOTALMENTE PROHIBIDO usar funciones de texto como 'unaccent', 'lower' o 'ILIKE' sobre esta columna."
      - name: day
        type: integer
        description: "El día del mes. Es un NÚMERO. ESTÁ TOTALMENTE PROHIBIDO usar funciones de texto como 'unaccent', 'lower' o 'ILIKE' sobre esta columna."
      - name: hour
        type: integer
        description: "Hora del día (0-23). Útil para analizar picos de venta horarios."
      - name: payment_method
        type: text
        description: "Método de pago usado (Credit Card, PayPal, Cash, etc.)."
      - name: discount_amount
        type: numeric
        description: "Monto descontado en la venta."

    # Métricas pre-calculadas (Atajos para la IA)
    metrics:
      - name: total_sales
        sql: "SUM(total)"
        description: "Suma total de dinero vendido."
      - name: total_quantity
        sql: "SUM(quantity)"
        description: "Total de unidades (productos) vendidas."
      - name: count_sales
        sql: "COUNT(sale_id)"
        description: "Número total de transacciones."
      - name: avg_ticket
        sql: "AVG(total)"
        description: "Ticket promedio de venta."

  # --- DIMENSIONES ---
  - name: dim_product
    schema: curated
    description: "Catálogo de productos."
    columns:
      - name: product_id
        type: integer
      - name: product_name
        type: text
        description: "Nombre comercial del producto."
      - name: category
        type: text
        description: "Categoría (Electrónica, Hogar, etc.)."
      - name: unit_price
        type: numeric
        description: "Precio unitario actual."

  - name: dim_customer
    schema: curated
    description: "Información de clientes."
    columns:
      - name: customer_id
        type: integer
      - name: region
        type: text
        description: "Región geográfica del cliente."
      - name: email
        type: text
        description: "Correo electrónico del cliente (Dato Sensible)."
      # Nota: first_name y last_name están disponibles si se necesitan

  - name: dim_employee
    schema: curated
    description: "Información de empleados y vendedores."
    columns:
      - name: employee_id
        type: integer
      - name: department
        type: text
        description: "Departamento (Ventas, IT, etc.)."
      - name: position
        type: text
        description: "Cargo del empleado."
      - name: salary
        type: numeric
        description: "Salario mensual (CONFIDENCIAL: Solo Admin)."

# --- RELACIONES (JOINS) ---
# Esto le enseña a la IA cómo unir las tablas sin equivocarse.
relationships:
  - from_table: fact_sales
    from_column: product_id
    to_table: dim_product
    to_column: product_id
    type: many_to_one

  - from_table: fact_sales
    from_column: customer_id
    to_table: dim_customer
    to_column: customer_id
    type: many_to_one

  - from_table: fact_sales
    from_column: employee_id
    to_table: dim_employee
    to_column: employee_id
    type: many_to_one
